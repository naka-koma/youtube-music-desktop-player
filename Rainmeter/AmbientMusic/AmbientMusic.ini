[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!CommandMeasure MeasureBridge "Run"]

[Variables]
W=360
H=82
BG=20,20,26,218
FG=242,239,245,238
Muted=172,166,180,225
Accent=226,145,174,240

[MeasureBridge]
Measure=Plugin
Plugin=RunCommand
Program=""#@#Bridge\AmbientMusicBridge.exe""
State=Hide
OutputType=ANSI
Timeout=0

[MeasureState]
Measure=Plugin
Plugin=WebParser
URL=http://127.0.0.1:38471/state
RegExp=(?siU)"connected":(true|false).*"title":"(.*?)".*"author":"(.*?)".*"thumbnail":"(.*?)".*"playing":(true|false)
UpdateRate=2

[MeasureTitle]
Measure=WebParser
URL=[MeasureState]
StringIndex=2

[MeasureArtist]
Measure=WebParser
URL=[MeasureState]
StringIndex=3

[MeasureArt]
Measure=WebParser
URL=[MeasureState]
StringIndex=4

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,#W#,#H#,14 | Fill Color #BG# | Stroke Color 255,255,255,20 | StrokeWidth 1

[MeterArt]
Meter=Image
MeasureName=MeasureArt
X=12
Y=11
W=60
H=60
PreserveAspectRatio=2
LeftMouseUpAction=[!ToggleConfig "AmbientMusic" "Expanded.ini"]

[MeterTitle]
Meter=String
MeasureName=MeasureTitle
X=84
Y=21
W=172
H=22
FontFace=Segoe UI
FontSize=11
FontColor=#FG#
StringStyle=Normal
ClipString=1
AntiAlias=1

[MeterArtist]
Meter=String
MeasureName=MeasureArtist
X=84
Y=43
W=172
H=20
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
ClipString=1
AntiAlias=1

[MeterPrev]
Meter=String
Text=PREV
X=263
Y=34
W=31
H=16
FontFace=Segoe UI
FontSize=8
FontColor=#FG#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePrev "Run"]

[MeasurePrev]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -Command "Invoke-RestMethod http://127.0.0.1:38471/prev -Method Post"
State=Hide

[MeterToggle]
Meter=String
Text=PLAY
X=298
Y=34
W=32
H=16
FontFace=Segoe UI
FontSize=8
FontColor=#Accent#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureToggle "Run"]

[MeasureToggle]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -Command "Invoke-RestMethod http://127.0.0.1:38471/toggle -Method Post"
State=Hide

[MeterNext]
Meter=String
Text=NEXT
X=333
Y=34
W=27
H=16
FontFace=Segoe UI
FontSize=8
FontColor=#FG#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasureNext "Run"]

[MeasureNext]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -Command "Invoke-RestMethod http://127.0.0.1:38471/next -Method Post"
State=Hide
