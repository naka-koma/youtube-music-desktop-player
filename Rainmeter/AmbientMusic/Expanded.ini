[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Variables]
W=360
BG=20,20,26,232
FG=242,239,245,238
Muted=172,166,180,225
Accent=226,145,174,240

[MeterPanel]
Meter=Shape
Shape=Rectangle 0,0,#W#,300,16 | Fill Color #BG# | Stroke Color 255,255,255,22 | StrokeWidth 1

[MeterHeader]
Meter=String
Text=AMBIENT MUSIC
X=20
Y=16
FontFace=Segoe UI
FontSize=9
FontColor=#Muted#
AntiAlias=1

[MeterClose]
Meter=String
Text=×
X=330
Y=8
FontFace=Segoe UI Light
FontSize=20
FontColor=#FG#
AntiAlias=1
LeftMouseUpAction=[!ToggleConfig "AmbientMusic" "AmbientMusic.ini"]

[MeterHint]
Meter=String
Text=Choose a playlist to start listening
X=20
Y=48
FontFace=Segoe UI
FontSize=10
FontColor=#FG#
AntiAlias=1

[MeterLiquid]
Meter=String
Text=♫  Liquid DnB
X=20
Y=89
FontFace=Segoe UI
FontSize=11
FontColor=#FG#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePlay0 "Run"][!ToggleConfig "AmbientMusic" "AmbientMusic.ini"]

[MeasurePlay0]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -Command "Invoke-RestMethod http://127.0.0.1:38471/playlist/0 -Method Post"
State=Hide

[MeterTrance]
Meter=String
Text=♫  Trance
X=20
Y=130
FontFace=Segoe UI
FontSize=11
FontColor=#FG#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePlay1 "Run"][!ToggleConfig "AmbientMusic" "AmbientMusic.ini"]

[MeasurePlay1]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -Command "Invoke-RestMethod http://127.0.0.1:38471/playlist/1 -Method Post"
State=Hide

[MeterFocus]
Meter=String
Text=♫  Focus
X=20
Y=171
FontFace=Segoe UI
FontSize=11
FontColor=#FG#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePlay2 "Run"][!ToggleConfig "AmbientMusic" "AmbientMusic.ini"]

[MeasurePlay2]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -Command "Invoke-RestMethod http://127.0.0.1:38471/playlist/2 -Method Post"
State=Hide

[MeterFavorites]
Meter=String
Text=♫  Favorites
X=20
Y=212
FontFace=Segoe UI
FontSize=11
FontColor=#FG#
AntiAlias=1
LeftMouseUpAction=[!CommandMeasure MeasurePlay3 "Run"][!ToggleConfig "AmbientMusic" "AmbientMusic.ini"]

[MeasurePlay3]
Measure=Plugin
Plugin=RunCommand
Program=powershell.exe
Parameter=-NoProfile -WindowStyle Hidden -Command "Invoke-RestMethod http://127.0.0.1:38471/playlist/3 -Method Post"
State=Hide

[MeterFooter]
Meter=String
Text=Playlist IDs: Bridge\playlists.json
X=20
Y=270
FontFace=Segoe UI
FontSize=8
FontColor=#Muted#
AntiAlias=1
